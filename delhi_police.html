<!DOCTYPE html>
<html lang="en">
<head>
    <script src="https://cdn.tailwindcss.com"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delhi Police Mock Tests</title>
</head>
<body class="bg-gradient-to-br from-[#eff6ff] via-[#f5f3ff] to-[#f0fdf4] min-h-screen text-gray-800 font-sans antialiased">

    <!-- Header / Navbar -->
    <div class="bg-white/90 backdrop-blur-md px-4 py-4 flex justify-between items-center shadow-md font-extrabold text-xl text-slate-800 sticky top-0 z-50 border-b border-blue-100">
        <!-- Back Button -->
        <button onclick="window.location.href='index.html'" class="text-sm bg-slate-100 hover:bg-slate-200 text-slate-700 px-3 py-1.5 rounded-lg flex items-center gap-1 transition">
            ⬅️ Back
        </button>
        <span class="flex items-center gap-2 text-blue-600">🚓 Delhi Police Exams</span>
        <div class="w-16"></div> <!-- Layout Balance ke liye -->
    </div>

    <!-- Main Content -->
    <div class="max-w-4xl mx-auto px-4 py-10 text-center">
        <h1 class="text-3xl md:text-4xl font-black text-slate-900 mb-3 tracking-tight leading-tight">
            Select Your <span class="text-blue-600">Exam</span>
        </h1>
        
        <!-- Delhi Police Exams Grid (4 Cards) -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-6 max-w-2xl mx-auto mt-10">
            
            <!-- DP Constable Executive -->
            <div class="bg-white/80 backdrop-blur-md p-6 rounded-2xl border border-blue-100 shadow-md transition duration-300 hover:shadow-xl hover:-translate-y-1 flex flex-col items-center">
                <div class="w-12 h-12 bg-blue-50 text-blue-600 rounded-xl flex justify-center items-center text-2xl mb-3">👮‍♂️</div>
                <div class="text-lg font-black text-slate-800 mb-1">Constable Executive</div>
                <div class="text-xs text-slate-500 mb-5 font-medium text-center">Delhi Police Constable Executive Full Mock Tests</div>
                <button onclick="alert('Constable Executive Test Starting Soon!')" 
                        class="w-full bg-blue-600 hover:bg-blue-700 text-white font-extrabold py-3 rounded-xl text-xs transition duration-300 shadow-md uppercase">
                    Start Practice
                </button>
            </div>

            <!-- DP Head Constable Ministerial -->
            <div class="bg-white/80 backdrop-blur-md p-6 rounded-2xl border border-indigo-100 shadow-md transition duration-300 hover:shadow-xl hover:-translate-y-1 flex flex-col items-center">
                <div class="w-12 h-12 bg-indigo-50 text-indigo-600 rounded-xl flex justify-center items-center text-2xl mb-3">💻</div>
                <div class="text-lg font-black text-slate-800 mb-1">HC Ministerial</div>
                <div class="text-xs text-slate-500 mb-5 font-medium text-center">Head Constable (Ministerial) Practice Set</div>
                <button onclick="alert('HC Ministerial Test Starting Soon!')" 
                        class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-extrabold py-3 rounded-xl text-xs transition duration-300 shadow-md uppercase">
                    Start Practice
                </button>
            </div>

            <!-- DP Head Constable AWO/TPO -->
            <div class="bg-white/80 backdrop-blur-md p-6 rounded-2xl border border-teal-100 shadow-md transition duration-300 hover:shadow-xl hover:-translate-y-1 flex flex-col items-center">
                <div class="w-12 h-12 bg-teal-50 text-teal-600 rounded-xl flex justify-center items-center text-2xl mb-3">📻</div>
                <div class="text-lg font-black text-slate-800 mb-1">HC AWO/TPO</div>
                <div class="text-xs text-slate-500 mb-5 font-medium text-center">Assistant Wireless Operator / Tele-Printer Operator</div>
                <button onclick="alert('HC AWO/TPO Test Starting Soon!')" 
                        class="w-full bg-teal-600 hover:bg-teal-700 text-white font-extrabold py-3 rounded-xl text-xs transition duration-300 shadow-md uppercase">
                    Start Practice
                </button>
            </div>

            <!-- DP Constable Driver -->
            <div class="bg-white/80 backdrop-blur-md p-6 rounded-2xl border border-amber-100 shadow-md transition duration-300 hover:shadow-xl hover:-translate-y-1 flex flex-col items-center">
                <div class="w-12 h-12 bg-amber-50 text-amber-600 rounded-xl flex justify-center items-center text-2xl mb-3">🚐</div>
                <div class="text-lg font-black text-slate-800 mb-1">Constable Driver</div>
                <div class="text-xs text-slate-500 mb-5 font-medium text-center">Delhi Police Constable Driver Mock Tests</div>
                <button onclick="alert('Constable Driver Test Starting Soon!')" 
                        class="w-full bg-amber-500 hover:bg-amber-600 text-white font-extrabold py-3 rounded-xl text-xs transition duration-300 shadow-md uppercase">
                    Start Practice
                </button>
            </div>

        </div>
    </div>

</body>
</html>
