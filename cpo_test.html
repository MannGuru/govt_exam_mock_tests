<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SSC CPO 2025 Previous Year - MANN GURU</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Arial, sans-serif; }
        body, html { background-color: #f4f6f7; height: 100%; overflow: hidden; }
        
        /* Header */
        .header { background-color: #2c3e50; color: white; padding: 12px 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 4px solid #3498db; }
        .exam-name { font-size: 16px; font-weight: bold; }
        .timer-box { font-size: 16px; font-weight: bold; color: #f1c40f; display: flex; align-items: center; gap: 5px; }
        
        /* Layout Grid */
        .main-container { display: flex; flex-direction: row; height: calc(100% - 46px); }
        
        /* Left Panel - Questions */
        .left-panel { flex: 1; display: flex; flex-direction: column; background: white; border-right: 2px solid #ccc; overflow: hidden; }
        .section-tabs { display: flex; background: #e0e0e0; overflow-x: auto; flex-shrink: 0; }
        .tab { padding: 12px 15px; cursor: pointer; font-weight: bold; color: #555; border-right: 1px solid #ccc; white-space: nowrap; font-size: 14px; }
        .tab.active { background: #3498db; color: white; }
        
        .question-area { flex: 1; padding: 20px; overflow-y: auto; }
        
        /* Bilingual Header Setup */
        .question-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #eee; padding-bottom: 10px; margin-bottom: 15px; }
        .q-info { font-weight: bold; color: #333; font-size: 14px; display: flex; flex-direction: column; gap: 4px; }
        .lang-toggle { background: #e8f4f8; padding: 5px 10px; border-radius: 5px; border: 1px solid #b3d4fc; display: flex; align-items: center; gap: 5px; font-size: 13px; font-weight: bold; color: #2c3e50; }
        .lang-toggle select { padding: 3px; font-size: 13px; font-weight: bold; border: 1px solid #ccc; border-radius: 3px; cursor: pointer; outline: none; }
        
        .question-text { font-size: 16px; margin-bottom: 20px; line-height: 1.6; font-weight: 500; }
        .options { display: flex; flex-direction: column; gap: 12px; }
        .option-label { display: flex; align-items: center; gap: 10px; cursor: pointer; font-size: 15px; padding: 5px 0; }
        input[type="radio"] { transform: scale(1.3); cursor: pointer; }
        
        /* Action Buttons */
        .action-buttons { padding: 15px; background: #f9f9f9; border-top: 1px solid #ccc; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 10px; flex-shrink: 0; }
        .btn { padding: 10px 15px; border: 1px solid #ccc; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 13px; flex: 1; min-width: 110px; text-align: center; }
        .btn-mark { background: #e67e22; color: white; border-color: #d35400; }
        .btn-clear { background: white; color: #333; }
        .btn-save { background: #27ae60; color: white; border-color: #2ecc71; }
        
        /* Right Panel - Palette */
        .right-panel { background: #fff; display: flex; flex-direction: column; width: 300px; flex-shrink: 0; }
        .candidate-info { padding: 15px; border-bottom: 1px solid #ccc; text-align: center; background: #f8f9fa; }
        .legend-box { padding: 12px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; border-bottom: 1px solid #ccc; font-size: 12px; flex-shrink: 0; background: #fafafa; }
        .legend-item { display: flex; align-items: center; gap: 6px; }
        .legend-icon { width: 20px; height: 20px; display: inline-block; }
        
        .palette-area { padding: 15px; flex: 1; overflow-y: auto; }
        .palette-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(40px, 1fr)); gap: 10px; margin-top: 10px; margin-bottom: 20px; }
        
        .q-bubble { width: 40px; height: 40px; display: flex; justify-content: center; align-items: center; font-weight: bold; cursor: pointer; border: 1px solid #ccc; font-size: 14px; margin: 0 auto; transition: 0.2s; }
        .not-visited { background: #f0f0f0; color: #333; border-radius: 4px; }
        .not-answered { background: #e74c3c; color: white; border-color: #c0392b; border-bottom-left-radius: 15px; border-top-right-radius: 15px; }
        .answered { background: #27ae60; color: white; border-color: #2ecc71; border-top-left-radius: 15px; border-bottom-right-radius: 15px; }
        .review { background: #9b59b6; color: white; border-color: #8e44ad; border-radius: 50%; }
        .answered-review { background: #9b59b6; color: white; border-color: #8e44ad; border-radius: 50%; position: relative; }
        .answered-review::after { content: '✔'; position: absolute; bottom: -2px; right: -2px; font-size: 10px; color: white; background: #27ae60; border-radius: 50%; width: 15px; height: 15px; display: flex; justify-content: center; align-items: center; font-weight: bold; border: 1px solid white; }
        
        .btn-submit { background: #3498db; color: white; border: none; padding: 15px; font-size: 16px; font-weight: bold; cursor: pointer; width: 100%; flex-shrink: 0; margin-top: auto; }
        
        .scorecard-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); justify-content: center; align-items: center; z-index: 1000; padding: 20px; }
        .scorecard { background: white; padding: 30px; border-radius: 10px; width: 100%; max-width: 420px; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
        .score-row { display: flex; justify-content: space-between; margin: 12px 0; border-bottom: 1px solid #eee; padding-bottom: 8px; font-size: 16px; }

        @media(max-width: 767px) {
            body, html { height: auto; overflow: auto; }
            .main-container { flex-direction: column; height: auto; }
            .left-panel { border-right: none; overflow: visible; }
            .question-area { overflow: visible; min-height: 300px; }
            .action-buttons { position: sticky; bottom: 0; z-index: 10; box-shadow: 0 -3px 8px rgba(0,0,0,0.1); }
            .right-panel { width: 100%; height: auto; border-top: 4px solid #2c3e50; }
            .candidate-info { display: none; }
            .palette-area { overflow: visible; padding-bottom: 30px; }
            .lang-toggle { padding: 3px 6px; font-size: 12px; }
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="exam-name">SSC CPO 2025 previous year</div>
        <div class="timer-box">⏱️ <span id="time">120:00</span></div>
    </div>

    <div class="main-container" id="exam-container">
        
        <div class="left-panel">
            <div class="section-tabs" id="section-tabs"></div>
            
            <div class="question-area">
                <div class="question-header">
                    <div class="q-info">
                        <span id="q-no">Question No. 1</span>
                        <span style="color:#e74c3c; font-size:12px;">Marks: +1, -0.25</span>
                    </div>
                    <div class="lang-toggle">
                        <label for="lang-select">View in:</label>
                        <select id="lang-select" onchange="changeLanguage()">
                            <option value="en">English</option>
                            <option value="hi">हिंदी (Hindi)</option>
                        </select>
                    </div>
                </div>
                
                <div class="question-text" id="q-text">Loading...</div>
                <div class="options" id="options-container"></div>
            </div>

            <div class="action-buttons">
                <button class="btn btn-mark" onclick="markForReview()">Review & Next</button>
                <button class="btn btn-clear" onclick="clearResponse()">Clear</button>
                <button class="btn btn-save" onclick="saveAndNext()">Save & Next</button>
            </div>
        </div>

        <div class="right-panel">
            <div class="candidate-info">
                <strong style="font-size:18px;">MANN GURU</strong><br>
                <small>Mock Test Series</small>
            </div>
            
            <div class="legend-box">
                <div class="legend-item"><div class="q-bubble answered legend-icon"></div> Answered</div>
                <div class="legend-item"><div class="q-bubble not-answered legend-icon"></div> Not Answered</div>
                <div class="legend-item"><div class="q-bubble not-visited legend-icon"></div> Not Visited</div>
                <div class="legend-item"><div class="q-bubble review legend-icon"></div> Review</div>
            </div>
            
            <div class="palette-area">
                <h4 style="margin-bottom:15px; color:#2c3e50; border-bottom:1px solid #ccc; padding-bottom:5px;" id="palette-title">Section</h4>
                <div class="palette-grid" id="palette-grid"></div>
            </div>
            <button class="btn-submit" onclick="showScorecard()">Submit Exam</button>
        </div>
    </div>

    <div class="scorecard-overlay" id="scorecard">
        <div class="scorecard">
            <h2>📊 CPO Scorecard</h2>
            <hr style="margin:15px 0">
            <div class="score-row"><span>Total Questions:</span> <strong id="res-total"></strong></div>
            <div class="score-row"><span>Attempted:</span> <strong id="res-att"></strong></div>
            <div class="score-row"><span>Correct ✅:</span> <strong style="color:#27ae60" id="res-right"></strong></div>
            <div class="score-row"><span>Incorrect ❌:</span> <strong style="color:#e74c3c" id="res-wrong"></strong></div>
            <div class="score-row"><span>Positive Marks:</span> <strong id="res-pos"></strong></div>
            <div class="score-row"><span>Negative Marks:</span> <strong id="res-neg"></strong></div>
            <hr style="margin:15px 0">
            <h3 style="color:#3498db; margin-bottom:20px; font-size:22px;">Final Score: <span id="res-score"></span></h3>
            <button class="btn btn-submit" style="border-radius:25px;" onclick="window.location.href='index.html'">Back to Dashboard</button>
        </div>
    </div>

    <script>
        // Yahan aapke PDF se questions add kiye gaye hain
        const examData = [
            {
                sectionName: "Reasoning",
                questions: [
                    { 
                        id: 1, 
                        text_en: "15 is related to 45 following a certain logic. Following the same logic, 25 is related to 125. Which of the following numbers is related to 80 using the same logic?", 
                        text_hi: "15 एक निश्चित तर्क के अनुसार 45 से संबंधित है। उसी तर्क के अनुसार, 25, 125 से संबंधित है। निम्नलिखित में से कौन सी संख्या उसी तर्क का उपयोग करके 80 से संबंधित है?",
                        options_en: ["20", "21", "18", "22"], 
                        options_hi: ["20", "21", "18", "22"], 
                        answer: 0 
                    },
                    { 
                        id: 2, 
                        text_en: "At a wedding reception, a man pointed to the groom and described him as the brother of the son of the son of his grandfather. How is the groom related to that man?", 
                        text_hi: "एक शादी के रिसेप्शन में, एक व्यक्ति ने दूल्हे की ओर इशारा किया और दूल्हे को अपने दादा के पुत्र के पुत्र का भाई बताया। दूल्हा उस आदमी का क्या लगता है?",
                        options_en: ["Uncle", "Father", "Brother", "Brother-in-law"], 
                        options_hi: ["चाचा", "पिता", "भाई", "साला/जीजा"], 
                        answer: 2 
                    }
                ]
            },
            {
                sectionName: "General Knowledge",
                questions: [
                    { 
                        id: 1, 
                        text_en: "According to Hindu calendar, Diwali falls in which of the following months?", 
                        text_hi: "हिंदू कैलेंडर के अनुसार, दीवाली निम्नलिखित में से किस महीने में आती है?",
                        options_en: ["Magha", "Ashwin", "Chaitra", "Kartika"], 
                        options_hi: ["माघ", "अश्विन", "चैत्र", "कार्तिक"], 
                        answer: 3 
                    }
                ]
            }
        ];

        let currentSec = 0, currentQ = 0;
        let currentLang = 'en'; 
        let uState = examData.map(sec => sec.questions.map(() => 'not-visited'));
        let uAns = examData.map(sec => sec.questions.map(() => null));

        function initExam() { renderTabs(); loadQ(0, 0); startTimer(120 * 60); }

        function renderTabs() {
            let html = "";
            examData.forEach((sec, idx) => {
                html += `<div class="tab ${idx === currentSec ? 'active' : ''}" onclick="switchSec(${idx})">${sec.sectionName}</div>`;
            });
            document.getElementById('section-tabs').innerHTML = html;
        }

        function switchSec(idx) { currentSec = idx; renderTabs(); loadQ(idx, 0); }

        function changeLanguage() {
            currentLang = document.getElementById('lang-select').value;
            loadQ(currentSec, currentQ); 
        }

        function loadQ(sIdx, qIdx) {
            currentSec = sIdx; currentQ = qIdx;
            const q = examData[sIdx].questions[qIdx];
            
            if(uState[sIdx][qIdx] === 'not-visited') uState[sIdx][qIdx] = 'not-answered';

            document.getElementById('q-no').innerText = `Question No. ${qIdx + 1}`;
            
            document.getElementById('q-text').innerText = currentLang === 'en' ? q.text_en : q.text_hi;
            
            let opts = "";
            let currentOptions = currentLang === 'en' ? q.options_en : q.options_hi;
            
            currentOptions.forEach((opt, i) => {
                let chk = uAns[sIdx][qIdx] === i ? "checked" : "";
                opts += `<label class="option-label"><input type="radio" name="opt" value="${i}" ${chk}> ${opt}</label>`;
            });
            document.getElementById('options-container').innerHTML = opts;
            renderPalette();
        }

        function getAns() {
            let s = document.querySelector('input[name="opt"]:checked');
            return s ? parseInt(s.value) : null;
        }

        function saveAndNext() {
            let a = getAns();
            if (a !== null) { uAns[currentSec][currentQ] = a; uState[currentSec][currentQ] = 'answered'; } 
            else { uState[currentSec][currentQ] = 'not-answered'; }
            nextQ();
        }

        function markForReview() {
            let a = getAns();
            if (a !== null) { uAns[currentSec][currentQ] = a; uState[currentSec][currentQ] = 'answered-review'; } 
            else { uState[currentSec][currentQ] = 'review'; }
            nextQ();
        }

        function clearResponse() {
            let r = document.querySelectorAll('input[name="opt"]');
            r.forEach(x => x.checked = false);
            uAns[currentSec][currentQ] = null;
            uState[currentSec][currentQ] = 'not-answered';
            renderPalette();
        }

        function nextQ() {
            if (currentQ < examData[currentSec].questions.length - 1) loadQ(currentSec, currentQ + 1);
            else if (currentSec < examData.length - 1) switchSec(currentSec + 1);
            else { renderPalette(); alert("End of test! Scroll down and click 'Submit Exam'."); window.scrollTo(0, document.body.scrollHeight); }
        }

        function renderPalette() {
            document.getElementById('palette-title').innerText = examData[currentSec].sectionName;
            let html = "";
            examData[currentSec].questions.forEach((q, i) => {
                let cls = uState[currentSec][i];
                let bdr = (i === currentQ) ? "border: 2px solid black; transform: scale(1.1);" : "";
                html += `<div class="q-bubble ${cls}" style="${bdr}" onclick="loadQ(${currentSec}, ${i})">${i + 1}</div>`;
            });
            document.getElementById('palette-grid').innerHTML = html;
        }

        function showScorecard() {
            let tQ = 0, att = 0, crt = 0, wrg = 0;
            examData.forEach((sec, sIdx) => {
                sec.questions.forEach((q, qIdx) => {
                    tQ++;
                    if (uAns[sIdx][qIdx] !== null) {
                        att++;
                        if (uAns[sIdx][qIdx] === q.answer) crt++; else wrg++;
                    }
                });
            });

            let pos = crt * 1, neg = wrg * 0.25;
            document.getElementById('res-total').innerText = tQ;
            document.getElementById('res-att').innerText = att;
            document.getElementById('res-right').innerText = crt;
            document.getElementById('res-wrong').innerText = wrg;
            document.getElementById('res-pos').innerText = `+${pos}`;
            document.getElementById('res-neg').innerText = `-${neg}`;
            document.getElementById('res-score').innerText = `${(pos - neg).toFixed(2)} / ${tQ}`;

            document.getElementById('exam-container').style.display = 'none';
            document.getElementById('scorecard').style.display = 'flex';
        }

        function startTimer(sec) {
            setInterval(() => {
                if(sec <= 0) { showScorecard(); return; }
                sec--;
                let m = Math.floor(sec / 60), s = sec % 60;
                document.getElementById('time').innerText = `${m < 10 ? '0'+m : m}:${s < 10 ? '0'+s : s}`;
            }, 1000);
        }

        initExam();
    </script>
</body>
</html>
