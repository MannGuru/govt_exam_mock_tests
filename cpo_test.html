<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SSC CPO Mock Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; background-color: #f4f6f7; }
        .header { background-color: #2c3e50; color: white; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; }
        .exam-title { font-size: 18px; font-weight: bold; }
        .timer { font-size: 18px; color: #f1c40f; font-weight: bold; }
        .container { display: flex; flex-direction: column; padding: 15px; gap: 15px; }
        @media(min-width: 768px) { .container { flex-direction: row; } }
        .question-section { flex: 3; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .palette-section { flex: 1; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .question-text { font-size: 18px; margin-bottom: 20px; font-weight: bold; }
        .option { margin-bottom: 12px; font-size: 16px; display: flex; align-items: center; gap: 10px; cursor: pointer; padding: 5px; }
        input[type="radio"] { transform: scale(1.3); cursor: pointer; }
        .buttons { margin-top: 25px; display: flex; flex-wrap: wrap; gap: 10px; }
        .btn { padding: 10px 12px; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; font-weight: bold; color: white; flex: 1; min-width: 120px; text-align: center; }
        .btn-save { background-color: #27ae60; }
        .btn-clear { background-color: #e67e22; }
        .btn-review { background-color: #9b59b6; }
        .btn-submit { background-color: #e74c3c; width: 100%; margin-top: 20px; }
        .btn-back { background-color: #34495e; margin-bottom: 15px; width: 100%; }
        .palette-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 15px; }
        .q-number { width: 35px; height: 35px; background: #ecf0f1; border: 1px solid #bdc3c7; display: flex; justify-content: center; align-items: center; border-radius: 4px; cursor: pointer; font-weight: bold; font-size:14px; }
        
        .answered { background: #27ae60 !important; color: white; border-color: #27ae60 !important; }
        .review { background: #9b59b6 !important; color: white; border-color: #9b59b6 !important; }
        .not-answered { background: #e74c3c !important; color: white; border-color: #e74c3c !important; }
        .active { border: 3px solid #34495e !important; transform: scale(1.1); }
    </style>
</head>
<body>

    <div class="header">
        <div class="exam-title">SSC CPO Pre - Mock Test</div>
        <div class="timer" id="time">Time Left: 120:00</div>
    </div>

    <div class="container">
        <div class="question-section">
            <button class="btn btn-back" onclick="window.location.href='index.html'">🔙 Back to Dashboard</button>
            <div class="question-text" id="q-text">Loading question...</div>
            <div id="options-container"></div>
            <div class="buttons">
                <button class="btn btn-save" onclick="saveAndNext()">Save & Next</button>
                <button class="btn btn-clear" onclick="clearResponse()">Clear</button>
                <button class="btn btn-review" onclick="markReview()">Review</button>
            </div>
        </div>

        <div class="palette-section">
            <h3 style="margin-top:0;">Question Palette</h3>
            <div class="palette-grid" id="palette"></div>
            <button class="btn btn-submit" onclick="submitExam()">Submit Exam</button>
        </div>
    </div>

    <script>
        const questions = [
            { id: 1, text: "Q1. Which of the following articles of the Constitution of India deals with the Right to Equality?", options: ["Article 14 to 18", "Article 19 to 22", "Article 23 to 24", "Article 25 to 28"], answer: 0 },
            { id: 2, text: "Q2. In a certain code language, 'ROSE' is written as 'TQUG'. How will 'BISCUIT' be written in that language?", options: ["DKUEWKV", "DKVEWKV", "DKUEWLV", "CJTDVJS"], answer: 0 },
            { id: 3, text: "Q3. Who among the following was the founder of the Maurya Empire?", options: ["Ashoka", "Chandragupta Maurya", "Bindusara", "Bimbisara"], answer: 1 },
            { id: 4, text: "Q4. If A is the brother of B, C is the sister of A, D is the brother of E, and E is the daughter of B, then who is the uncle of D?", options: ["A", "B", "C", "Cannot be determined"], answer: 0 },
            { id: 5, text: "Q5. The SI unit of Electric Current is?", options: ["Volt", "Ampere", "Ohm", "Watt"], answer: 1 }
        ];

        let currentQ = 0;
        let userAnswers = new Array(questions.length).fill(null);
        let qStatus = new Array(questions.length).fill("not-visited"); 

        function loadQuestion(index) {
            currentQ = index;
            const q = questions[index];
            document.getElementById('q-text').innerText = q.text;
            let optsHTML = "";
            q.options.forEach((opt, i) => {
                let checked = userAnswers[index] === i ? "checked" : "";
                optsHTML += `<div class="option" onclick="selectOption(${i})">
                    <input type="radio" name="q" id="opt${i}" ${checked}>
                    <label for="opt${i}">${opt}</label>
                </div>`;
            });
            document.getElementById('options-container').innerHTML = optsHTML;
            if(qStatus[index] === "not-visited") qStatus[index] = "not-answered";
            updatePalette();
        }

        function selectOption(optIndex) { document.getElementById(`opt${optIndex}`).checked = true; }

        function saveAndNext() {
            let selected = document.querySelector('input[name="q"]:checked');
            if(selected) {
                userAnswers[currentQ] = parseInt(selected.id.replace('opt',''));
                qStatus[currentQ] = "answered";
            } else { qStatus[currentQ] = "not-answered"; }
            
            if(currentQ < questions.length - 1) loadQuestion(currentQ + 1);
            else { updatePalette(); alert("You have reached the last question."); }
        }

        function clearResponse() {
            let selected = document.querySelector('input[name="q"]:checked');
            if(selected) selected.checked = false;
            userAnswers[currentQ] = null;
            qStatus[currentQ] = "not-answered";
            updatePalette();
        }

        function markReview() {
            qStatus[currentQ] = "review";
            if(currentQ < questions.length - 1) loadQuestion(currentQ + 1);
            else updatePalette();
        }

        function updatePalette() {
            let pHTML = "";
            for(let i=0; i<questions.length; i++) {
                let cls = "q-number ";
                if(qStatus[i] === "answered") cls += "answered";
                else if(qStatus[i] === "review") cls += "review";
                else if(qStatus[i] === "not-answered") cls += "not-answered";
                if(i === currentQ) cls += " active";
                pHTML += `<div class="${cls}" onclick="loadQuestion(${i})">${i+1}</div>`;
            }
            document.getElementById('palette').innerHTML = pHTML;
        }

        function submitExam() {
            let score = 0;
            for(let i=0; i<questions.length; i++) {
                if(userAnswers[i] === questions[i].answer) score++;
            }
            alert(`Exam Submitted!\nYour Score is: ${score} out of ${questions.length}`);
            window.location.href = 'index.html'; // Goes back to dashboard
        }

        let timeLeft = 120 * 60; 
        setInterval(() => {
            if(timeLeft <= 0) return;
            timeLeft--;
            let m = Math.floor(timeLeft / 60);
            let s = timeLeft % 60;
            document.getElementById('time').innerText = `Time Left: ${m}:${s < 10 ? '0'+s : s}`;
        }, 1000);

        loadQuestion(0);
    </script>
</body>
</html>
